<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">从基址限长连续区域到现代分页保护</title>
  <desc id="desc">左侧展示 P11 的基址限长范围检查和读写门控，右侧展示虚拟地址经 TLB 页表和 MMU 映射到离散物理页并检查读写执行权限。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38556f"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .panel { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17324d; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #263746; }
      .text { font: 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #334a5e; }
      .small { font: 14px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #52677a; }
      .mono { font: 700 18px Consolas, monospace; fill: #17324d; }
      .box { fill: #ffffff; stroke: #7d9ab2; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="820" fill="#f7fafc"/>
  <rect x="34" y="28" width="1332" height="78" rx="18" fill="#eaf2f8" stroke="#9ebad0"/>
  <text x="700" y="65" class="title" text-anchor="middle">P11 的保护直觉如何接到现代虚拟内存</text>
  <text x="700" y="92" class="text" text-anchor="middle">共同原则：内核安装受保护规则，CPU / MMU 对每次取指、加载和存储执行检查</text>

  <rect x="38" y="132" width="640" height="612" rx="20" fill="#fff8e8" stroke="#d5a044" stroke-width="2"/>
  <text x="358" y="174" class="panel" text-anchor="middle">课程模型：一个连续物理区间</text>
  <text x="358" y="202" class="small" text-anchor="middle">P11 正文采用绝对地址 A 的范围检查</text>

  <rect x="82" y="232" width="170" height="68" rx="12" class="box"/>
  <text x="167" y="260" class="label" text-anchor="middle">CPU 发出地址 A</text>
  <text x="167" y="284" class="small" text-anchor="middle">取指 / load / store</text>
  <line x1="252" y1="266" x2="318" y2="266" stroke="#38556f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="324" y="222" width="302" height="88" rx="12" fill="#f1e2ba" stroke="#b48328" stroke-width="2"/>
  <text x="475" y="251" class="label" text-anchor="middle">比较器 + 加法器 + 与门</text>
  <text x="475" y="281" class="mono" text-anchor="middle">base ≤ A &lt; base + limit</text>

  <line x1="475" y1="310" x2="475" y2="356" stroke="#38556f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="126" y="358" width="454" height="104" rx="14" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/>
  <text x="353" y="388" class="label" text-anchor="middle">例：base = 1000，limit = 500</text>
  <line x1="166" y1="429" x2="540" y2="429" stroke="#38556f" stroke-width="4"/>
  <circle cx="228" cy="429" r="8" fill="#2f855a"/>
  <circle cx="492" cy="429" r="8" fill="#b84747"/>
  <rect x="228" y="414" width="264" height="30" fill="#ccebd5" opacity="0.9"/>
  <text x="228" y="455" class="small" text-anchor="middle">1000 含下界</text>
  <text x="492" y="455" class="small" text-anchor="middle">1500 不含上界</text>

  <line x1="353" y1="462" x2="353" y2="504" stroke="#38556f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="78" y="510" width="250" height="92" rx="14" fill="#e5f5e9" stroke="#4d9b63" stroke-width="2"/>
  <text x="203" y="543" class="label" text-anchor="middle">合法</text>
  <text x="203" y="572" class="text" text-anchor="middle">允许 read / write 使能</text>
  <rect x="386" y="510" width="250" height="92" rx="14" fill="#fde8e8" stroke="#b84747" stroke-width="2"/>
  <text x="511" y="543" class="label" text-anchor="middle">非法</text>
  <text x="511" y="572" class="text" text-anchor="middle">阻止访问并触发异常</text>

  <rect x="80" y="630" width="556" height="78" rx="12" fill="#17324d"/>
  <text x="358" y="659" class="label" style="fill:#ffffff" text-anchor="middle">优势：比较简单、每次自动检查</text>
  <text x="358" y="687" class="small" style="fill:#dce9f3" text-anchor="middle">限制：要求一个连续区域，难以逐页共享和设置 R/W/X 权限</text>

  <rect x="722" y="132" width="640" height="612" rx="20" fill="#eef7f1" stroke="#4d9b63" stroke-width="2"/>
  <text x="1042" y="174" class="panel" text-anchor="middle">现代常见模型：分页 + MMU</text>
  <text x="1042" y="202" class="small" text-anchor="middle">进程发出虚拟地址；离散物理页由页表映射</text>

  <rect x="762" y="230" width="202" height="78" rx="12" class="box"/>
  <text x="863" y="260" class="label" text-anchor="middle">虚拟地址 VA</text>
  <text x="863" y="286" class="small" text-anchor="middle">虚拟页号 + 页内偏移</text>
  <line x1="964" y1="269" x2="1024" y2="269" stroke="#38556f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1030" y="218" width="286" height="102" rx="12" fill="#d9eaf7" stroke="#4f7cac" stroke-width="2"/>
  <text x="1173" y="248" class="label" text-anchor="middle">MMU + TLB / 页表规则</text>
  <text x="1173" y="276" class="text" text-anchor="middle">找到物理页框</text>
  <text x="1173" y="301" class="text" text-anchor="middle">检查 User、R、W、X 等权限</text>

  <line x1="1173" y1="320" x2="1173" y2="358" stroke="#38556f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="774" y="366" width="536" height="180" rx="14" fill="#ffffff" stroke="#8da7ba" stroke-width="2"/>
  <text x="1042" y="397" class="label" text-anchor="middle">同一进程的离散映射</text>

  <g transform="translate(810 418)">
    <rect x="0" y="0" width="112" height="40" rx="6" fill="#d9eaf7" stroke="#4f7cac"/>
    <rect x="0" y="48" width="112" height="40" rx="6" fill="#d9eaf7" stroke="#4f7cac"/>
    <rect x="0" y="96" width="112" height="40" rx="6" fill="#d9eaf7" stroke="#4f7cac"/>
    <text x="56" y="25" class="small" text-anchor="middle">虚拟页 0</text>
    <text x="56" y="73" class="small" text-anchor="middle">虚拟页 1</text>
    <text x="56" y="121" class="small" text-anchor="middle">虚拟页 2</text>
  </g>
  <g transform="translate(1158 405)">
    <rect x="0" y="0" width="112" height="32" rx="5" fill="#e5f5e9" stroke="#4d9b63"/>
    <rect x="0" y="40" width="112" height="32" rx="5" fill="#f3f3f3" stroke="#9aa7b1"/>
    <rect x="0" y="80" width="112" height="32" rx="5" fill="#e5f5e9" stroke="#4d9b63"/>
    <rect x="0" y="120" width="112" height="32" rx="5" fill="#e5f5e9" stroke="#4d9b63"/>
    <text x="56" y="21" class="small" text-anchor="middle">物理页 12</text>
    <text x="56" y="61" class="small" text-anchor="middle">物理页 33</text>
    <text x="56" y="101" class="small" text-anchor="middle">物理页 87</text>
    <text x="56" y="141" class="small" text-anchor="middle">物理页 105</text>
  </g>
  <line x1="922" y1="438" x2="1158" y2="421" stroke="#4f7cac" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="922" y1="486" x2="1158" y2="501" stroke="#4f7cac" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="922" y1="534" x2="1158" y2="541" stroke="#4f7cac" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1036" y="427" class="small">R-X / User</text>
  <text x="1010" y="493" class="small">RW- / User</text>
  <text x="1018" y="528" class="small">共享页</text>

  <rect x="758" y="574" width="258" height="102" rx="14" fill="#e5f5e9" stroke="#4d9b63" stroke-width="2"/>
  <text x="887" y="608" class="label" text-anchor="middle">允许</text>
  <text x="887" y="637" class="text" text-anchor="middle">访问映射后的物理页</text>
  <rect x="1068" y="574" width="258" height="102" rx="14" fill="#fde8e8" stroke="#b84747" stroke-width="2"/>
  <text x="1197" y="608" class="label" text-anchor="middle">当前不能完成</text>
  <text x="1197" y="637" class="text" text-anchor="middle">页故障 / 保护异常 → 内核</text>

  <rect x="78" y="768" width="1244" height="38" rx="10" fill="#17324d"/>
  <text x="700" y="793" class="text" style="fill:#ffffff" text-anchor="middle">基址/限长负责建立第一层“范围门禁”直觉；分页把门禁细化到每一页，并把虚拟地址映射到离散物理页</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">客户端、服务器、端口与套接字</title>
  <desc id="desc">客户端进程通过本地套接字向服务器 IP 地址和端口发送请求。操作系统的网络协议栈根据协议、目标 IP 和目标端口把数据交给监听套接字，再由服务器进程处理并返回响应。端口是传输层编号，不是进程或物理插孔。</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fcff"/>
      <stop offset="1" stop-color="#f1f8f5"/>
    </linearGradient>
    <linearGradient id="network" x1="0" x2="1">
      <stop offset="0" stop-color="#367bd7"/>
      <stop offset="1" stop-color="#38a78b"/>
    </linearGradient>
    <marker id="request" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2969d8"/>
    </marker>
    <marker id="response" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#238b84"/>
    </marker>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#273060" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
      .h1 { font-size: 34px; font-weight: 800; fill: #17233d; }
      .h2 { font-size: 24px; font-weight: 800; fill: #17233d; }
      .h3 { font-size: 20px; font-weight: 800; fill: #17233d; }
      .body { font-size: 18px; fill: #37455f; }
      .small { font-size: 16px; fill: #53627d; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 17px; fill: #253651; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#bg2)"/>
  <rect x="40" y="28" width="1520" height="88" rx="22" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="78" y="77" class="ui h1">客户端、服务器、端口与套接字：一次请求到底送到谁手里？</text>
  <text x="78" y="103" class="ui body">先记住：IP 大致定位一台主机或网络接口；端口定位主机上的一个通信入口；最终由操作系统把数据交给相应套接字。</text>

  <!-- Client host -->
  <g filter="url(#shadow2)">
    <rect x="70" y="165" width="455" height="512" rx="24" fill="#ffffff" stroke="#82afea" stroke-width="3"/>
  </g>
  <rect x="100" y="194" width="216" height="39" rx="20" fill="#2969d8"/>
  <text x="135" y="222" class="ui h3 white">客户端所在主机</text>
  <text x="100" y="269" class="ui h3">示例 IP：192.0.2.10</text>
  <rect x="105" y="300" width="385" height="126" rx="16" fill="#f0f6ff" stroke="#a7c9f4" stroke-width="2"/>
  <text x="130" y="334" class="ui h3">客户端进程（浏览器 / App）</text>
  <text x="130" y="365" class="ui body">“我想访问网页 / 请求数据”</text>
  <text x="130" y="398" class="ui small">它不是直接把电信号塞进网线。</text>
  <rect x="105" y="462" width="385" height="168" rx="16" fill="#e6f2ff" stroke="#4b90e8" stroke-width="3"/>
  <text x="130" y="498" class="ui h3">客户端套接字（socket）</text>
  <text x="130" y="531" class="ui mono">TCP 192.0.2.10:51524</text>
  <text x="130" y="562" class="ui small">通常由系统选一个临时本地端口</text>
  <text x="130" y="594" class="ui small">进程经 API / 系统调用使用它</text>
  <line x1="298" y1="426" x2="298" y2="451" stroke="#2969d8" stroke-width="4" marker-end="url(#request)"/>

  <!-- Network -->
  <g filter="url(#shadow2)">
    <rect x="590" y="305" width="420" height="245" rx="26" fill="url(#network)"/>
  </g>
  <text x="711" y="354" class="ui h2 white">网络</text>
  <text x="644" y="393" class="ui body white">传输的不是“某个进程”</text>
  <text x="644" y="424" class="ui body white">而是带有地址和协议的信息包</text>
  <rect x="625" y="451" width="350" height="64" rx="12" fill="#ffffff" fill-opacity="0.94"/>
  <text x="648" y="479" class="ui mono">TCP 192.0.2.10:51524</text>
  <text x="648" y="504" class="ui mono">→ 203.0.113.20:443</text>

  <!-- Server host -->
  <g filter="url(#shadow2)">
    <rect x="1075" y="165" width="455" height="512" rx="24" fill="#ffffff" stroke="#72b9b3" stroke-width="3"/>
  </g>
  <rect x="1105" y="194" width="216" height="39" rx="20" fill="#238b84"/>
  <text x="1140" y="222" class="ui h3 white">服务器所在主机</text>
  <text x="1105" y="269" class="ui h3">示例 IP：203.0.113.20</text>
  <rect x="1110" y="300" width="385" height="168" rx="16" fill="#e4faf7" stroke="#72b9b3" stroke-width="3"/>
  <text x="1135" y="336" class="ui h3">监听套接字</text>
  <text x="1135" y="369" class="ui mono">TCP 203.0.113.20:443</text>
  <text x="1135" y="400" class="ui small">“到这个端口的连接，先交给我”</text>
  <text x="1135" y="432" class="ui small">由服务器程序先向操作系统登记</text>
  <rect x="1110" y="502" width="385" height="128" rx="16" fill="#f1fbf7" stroke="#a8d8cd" stroke-width="2"/>
  <text x="1135" y="538" class="ui h3">服务器进程（Web 服务）</text>
  <text x="1135" y="570" class="ui body">读取请求 → 处理 → 生成响应</text>
  <text x="1135" y="602" class="ui small">实际连接会对应已建立的通信端点</text>
  <line x1="1302" y1="471" x2="1302" y2="492" stroke="#238b84" stroke-width="4" marker-end="url(#response)"/>

  <!-- Arrows -->
  <path d="M490 489 C535 489, 550 470, 585 470" fill="none" stroke="#2969d8" stroke-width="6" marker-end="url(#request)"/>
  <text x="520" y="447" class="ui h3" fill="#2969d8">请求</text>
  <path d="M1015 510 C1050 510, 1052 510, 1105 510" fill="none" stroke="#2969d8" stroke-width="6" marker-end="url(#request)"/>
  <path d="M1105 538 C1050 538, 1050 573, 1015 573" fill="none" stroke="#238b84" stroke-width="6" marker-end="url(#response)"/>
  <path d="M585 591 C550 591, 540 605, 490 605" fill="none" stroke="#238b84" stroke-width="6" marker-end="url(#response)"/>
  <text x="838" y="627" class="ui h3" fill="#238b84">响应</text>

  <!-- Demultiplexing explanation -->
  <rect x="70" y="720" width="1460" height="128" rx="22" fill="#fffef8" stroke="#e5bd54" stroke-width="3" filter="url(#shadow2)"/>
  <text x="104" y="758" class="ui h2">服务器端真正发生的事：操作系统按“协议 + 目标 IP + 目标端口”找到监听套接字</text>
  <text x="104" y="791" class="ui body">不是“端口 443 就等于某个固定进程”。服务器程序先绑定并监听；内核把到达的数据交给那个套接字，程序再从套接字读取。</text>
  <text x="104" y="821" class="ui small">多个客户端可以同时连接同一服务端口；每条已建立连接还会以通信双方的地址和端口等信息区分。</text>

  <!-- Definitions -->
  <rect x="70" y="882" width="454" height="125" rx="20" fill="#ffffff" stroke="#a7c9f4" stroke-width="2"/>
  <text x="100" y="917" class="ui h3">端口（port）</text>
  <text x="100" y="947" class="ui body">传输层使用的编号，帮助主机</text>
  <text x="100" y="974" class="ui body">把数据交到正确的通信入口。</text>
  <rect x="573" y="882" width="454" height="125" rx="20" fill="#ffffff" stroke="#a8d8cd" stroke-width="2"/>
  <text x="603" y="917" class="ui h3">套接字（socket）</text>
  <text x="603" y="947" class="ui body">操作系统提供给进程使用的</text>
  <text x="603" y="974" class="ui body">通信端点 / 内核对象接口。</text>
  <rect x="1076" y="882" width="454" height="125" rx="20" fill="#fff5ef" stroke="#edaa7d" stroke-width="2"/>
  <text x="1106" y="917" class="ui h3">不要混淆</text>
  <text x="1106" y="947" class="ui body">端口不是进程，也不是电脑上</text>
  <text x="1106" y="974" class="ui body">看得见的 USB / 网线插孔。</text>
</svg>
